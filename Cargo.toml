[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
craft-proton-sync-core = { path = "crates/core" }
craft-proton-sync-ui-egui = { path = "crates/ui-egui" }
craft-proton-sync-native = { path = "crates/native" }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
